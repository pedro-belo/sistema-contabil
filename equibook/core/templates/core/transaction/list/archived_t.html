<div class="card my-3 border border-secondary-subtle rounded-3 shadow-sm overflow-hidden opacity-75">
  <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center border-bottom border-secondary-subtle bg-secondary bg-opacity-50">
    <div class="d-flex align-items-center gap-2">
      <span class="fw-semibold text-white small">
        <span class="text-secondary me-1">#{{transaction.id}}</span>{{transaction.title}}
      </span>
      <span class="badge bg-secondary bg-opacity-50 text-white small">Arquivada</span>
    </div>
    <div class="d-flex gap-1">
      <a class="btn btn-sm border-0 text-secondary" title="Balancete"
        href="{% url 'core:trial-balance' pk=transaction.id %}">
        <span class="material-icons-outlined" style="font-size:1rem;">event_note</span>
      </a>
      <a class="btn btn-sm border-0 text-secondary" title="Detalhes"
        href="{% url 'core:transaction-detail' pk=transaction.id %}">
        <span class="material-icons-outlined" style="font-size:1rem;">file_open</span>
      </a>
    </div>
  </div>
</div>
